<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程規劃表</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <p class="app-subtitle">日程規劃</p>
        <h1>簡約行程表</h1>
      </div>
      <div class="header-actions">
        <label class="date-picker" for="selectedDate">
          <span>查看日期</span>
          <input type="date" id="selectedDate">
        </label>
        <div class="view-switch" role="tablist" aria-label="檢視切換">
          <button type="button" class="btn btn-secondary active" data-view="list">清單</button>
          <button type="button" class="btn btn-secondary" data-view="calendar">日曆</button>
        </div>
        <button type="button" class="btn btn-primary" id="importSuggestion">自動填入建議行程</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel content-panel">
        <div class="panel-header">
          <div>
            <p class="panel-label">你的行程</p>
            <h2 id="panelTitle">今日安排</h2>
          </div>
          <div class="summary-pill">
            <span id="taskCount">0</span> / <span id="taskTotal">0</span> 筆
          </div>
        </div>

        <div class="status-row">
          <p id="selectedDateLabel" class="selected-date-label"></p>
          <p class="muted">點選日曆或切換日期，即可查看當日任務。</p>
        </div>

        <div id="taskListView" class="task-list-view">
          <ul id="taskList" class="task-list"></ul>
        </div>

        <div id="calendarView" class="calendar-view hidden">
          <div class="calendar-header">
            <button type="button" class="btn btn-secondary" id="prevMonth">◀</button>
            <div class="calendar-title" id="calendarMonthLabel"></div>
            <button type="button" class="btn btn-secondary" id="nextMonth">▶</button>
          </div>
          <div class="calendar-weekdays">
            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>
      </section>

      <aside class="panel form-panel">
        <div class="panel-header">
          <div>
            <p class="panel-label">新增/編輯</p>
            <h2>新增日程</h2>
          </div>
        </div>

        <form id="taskForm" class="task-form">
          <div class="field-group">
            <label for="taskTitle">標題</label>
            <input type="text" id="taskTitle" placeholder="例如：團隊會議" required>
          </div>

          <div class="field-group">
            <label for="taskDateTime">時間</label>
            <input type="datetime-local" id="taskDateTime" required>
          </div>

          <div class="field-group">
            <label for="taskPriority">優先級</label>
            <select id="taskPriority">
              <option value="high">高</option>
              <option value="normal" selected>中</option>
              <option value="low">低</option>
            </select>
          </div>

          <div class="field-group">
            <label for="taskTags">標籤</label>
            <input type="text" id="taskTags" placeholder="例如：工作,個人">
          </div>

          <div class="field-group">
            <label for="taskNotes">備註</label>
            <textarea id="taskNotes" rows="4" placeholder="可填寫地點、提醒事項..." ></textarea>
          </div>

          <button type="submit" class="btn btn-primary">新增任務</button>
        </form>

        <div class="form-actions">
          <div class="field-group">
            <label for="gasUrl">GAS Web App URL</label>
            <input type="url" id="gasUrl" placeholder="https://script.google.com/macros/s/XXX/exec">
          </div>
          <button type="button" class="btn btn-secondary" id="backupToGas">備份到 Google Sheets</button>
        </div>

        <div class="hint-card">
          <p>每筆任務會儲存在瀏覽器中。重新整理後，資料仍會保留。</p>
          <p>輸入你的 GAS Web App URL，按下「備份到 Google Sheets」即可將資料同步到試算表。</p>
        </div>
      </aside>
    </main>
  </div>

  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="editModalTitle">編輯任務</h3>
        <button type="button" class="btn btn-icon" id="closeEditModal" aria-label="關閉">✕</button>
      </div>
      <form id="editForm" class="modal-form">
        <div class="field-group">
          <label for="editTitle">標題</label>
          <input type="text" id="editTitle" required>
        </div>
        <div class="field-group">
          <label for="editDateTime">時間</label>
          <input type="datetime-local" id="editDateTime" required>
        </div>
        <div class="field-group">
          <label for="editPriority">優先級</label>
          <select id="editPriority">
            <option value="high">高</option>
            <option value="normal">中</option>
            <option value="low">低</option>
          </select>
        </div>
        <div class="field-group">
          <label for="editTags">標籤</label>
          <input type="text" id="editTags" placeholder="例如：工作,個人">
        </div>
        <div class="field-group">
          <label for="editNotes">備註</label>
          <textarea id="editNotes" rows="4"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelEdit">取消</button>
          <button type="submit" class="btn btn-primary">儲存變更</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
